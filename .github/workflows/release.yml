name: Release NeoVim Plugin

on:
  push:
    branches: [ main, master ]

  # Reusable workflow : Usually called by a `snapshot` workflow
  workflow_call:
    inputs:
      snapshot:
        description: "Is this a snapshot build?"
        required: false
        default: false
        type: boolean

  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Force snapshot release'
        required: false
        type: boolean
        default: false

env:
  SNAPSHOT: ${{ inputs.snapshot || false }}
  BUILD_ID: ${{ github.run_number }}

jobs:
  ##########################################################################################
  # Release NeoVim Plugin
  ##########################################################################################
  release:
    name: Release NeoVim Plugin
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: write
      packages: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Setup Boxlang
      uses: ortus-boxlang/setup-boxlang@main

    - name: Prep Version
      id: read-config
      run: |
        # Read bundle version from box.json
        BUNDLE_VERSION=$(cat version.json | jq '.version' -r)
        echo "VERSION=$BUNDLE_VERSION" >> $GITHUB_ENV
        echo "Bundle version: $BUNDLE_VERSION"

        # Determine if this is a snapshot release
        if [ $GITHUB_REF == 'refs/heads/development' ]; then
          echo "SNAPSHOT=true" >> $GITHUB_ENV
          echo "This is a snapshot release"
          # For snapshots, append -snapshot to version if not already present
          if [[ "$BUNDLE_VERSION" != *"snapshot"* ]]; then
            VERSION_SNAPSHOT="${BUNDLE_VERSION}-snapshot"
            echo "VERSION=$VERSION_SNAPSHOT" >> $GITHUB_ENV
          fi
        else
          echo "SNAPSHOT=false" >> $GITHUB_ENV
          echo "This is a production release"
        fi

    - name: Build Distribution
      run: |
        echo "📦 Building vim-boxlang distribution v${{ env.VERSION }}"

        # Create build directory
        mkdir -p build/artifacts

        # Create distribution directory with proper Vim plugin structure
        mkdir -p build/vim-boxlang/syntax
        mkdir -p build/vim-boxlang/ftdetect
        mkdir -p build/vim-boxlang/doc

        # Copy plugin files
        cp -r syntax/*.vim build/vim-boxlang/syntax/
        cp -r ftdetect/*.vim build/vim-boxlang/ftdetect/
        cp -r doc/*.txt build/vim-boxlang/doc/

        # Copy documentation files
        cp README.md build/vim-boxlang/
        cp license.txt build/vim-boxlang/
        cp changelog.md build/vim-boxlang/

        # Create the zip archive
        cd build
        zip -r "artifacts/vim-boxlang-${{ env.VERSION }}.zip" vim-boxlang/
        cd ..

        # Generate SHA256 checksum
        cd build/artifacts
        sha256sum "vim-boxlang-${{ env.VERSION }}.zip" > "vim-boxlang-${{ env.VERSION }}.zip.sha256"
        cd ../..

        # Display results
        echo ""
        echo "✅ Distribution built successfully!"
        echo "📦 Package: build/artifacts/vim-boxlang-${{ env.VERSION }}.zip"
        ls -lh build/artifacts/

        # Show what's in the zip
        echo ""
        echo "📋 Package contents:"
        unzip -l "build/artifacts/vim-boxlang-${{ env.VERSION }}.zip"


    - name: Update changelog [unreleased] with latest version
      uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
      if: env.SNAPSHOT == 'false'
      with:
        changelogPath: ./changelog.md
        tag: v${{ env.VERSION }}

    - name: Changelog Updates
      run: |
        npm install -g markdownlint-cli
        markdownlint changelog.md --fix

    - name: Commit Changelog [unreleased] with latest version
      uses: EndBug/add-and-commit@v10.0.0
      if: env.SNAPSHOT == 'false'
      with:
        author_name: Github Actions
        author_email: info@ortussolutions.com
        message: "Finalized changelog for v${{ env.VERSION }}"
        add: changelog.md

    - name: Tag Version
      uses: rickstaa/action-create-tag@v1.7.2
      if: env.SNAPSHOT == 'false'
      with:
        tag: "v${{ env.VERSION }}"
        force_push_tag: true
        message: "Latest Release v${{ env.VERSION }}"

    - name: Upload Build Artifacts
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: vim-boxlang
        path: |
          build/artifacts/vim-boxlang-${{ env.VERSION }}.zip
          build/artifacts/vim-boxlang-${{ env.VERSION }}.zip.sha256
          version.json
          changelog.md
        retention-days: 7

    - name: Upload Distributions to S3
      uses: jakejarvis/s3-sync-action@master
      with:
        args: --acl public-read
      env:
        AWS_S3_BUCKET: "downloads.ortussolutions.com"
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_ACCESS_SECRET }}
        SOURCE_DIR: "build/artifacts"
        DEST_DIR: "ortussolutions/vim-boxlang/${{ env.VERSION }}"

    - name: Create GitHub Release
      if: env.SNAPSHOT == 'false'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        name: v${{ env.VERSION }}
        body_path: changelog.md
        files: |
          build/artifacts/vim-boxlang-${{ env.VERSION }}.zip
          build/artifacts/vim-boxlang-${{ env.VERSION }}.zip.sha256
          version.json
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Release Summary
      run: |
        echo "🎉 Release Summary:"
        echo "===================="
        echo "📦 Bundle Version: ${{ env.VERSION }}"
        echo "📸 Snapshot: ${{ env.SNAPSHOT }}"
        echo "🌐 S3 Location: https://downloads.ortussolutions.com/ortussolutions/vim-boxlang/${{ env.VERSION }}/"

        if [[ "${{ env.SNAPSHOT }}" == "false" ]]; then
          echo "🏷️  GitHub Release: https://github.com/${{ github.repository }}/releases/tag/v${{ env.VERSION }}"
        fi

  ##########################################################################################
  # Prep Next Release
  ##########################################################################################
  prep_next_release:
    name: Prep Next Release
    if: github.ref != 'refs/heads/development'
    runs-on: ubuntu-latest
    needs: [ release ]
    permissions:
      checks: write
      contents: write
      packages: write

    steps:
      - name: Checkout Development Repository
        uses: actions/checkout@v6
        with:
          ref: development

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: vim-boxlang
          path: .tmp

      - name: Copy Changelog
        run: |
          ls -lR .tmp/
          cp .tmp/changelog.md changelog.md || true

      - name: Bump Version
        if: ${{ always() }}
        run: |
          # Bump minor version in version.json
          CURRENT_VERSION=$(cat version.json | jq -r '.version')
          NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. '{$2+=1; $3=0; print $1"."$2"."$3}')
          jq --arg version "$NEW_VERSION" '.version = $version' version.json > version.json.tmp
          mv version.json.tmp version.json
          echo "Bumped version from $CURRENT_VERSION to $NEW_VERSION"
          git pull

      - name: Commit Version Bump
        uses: EndBug/add-and-commit@v10.0.0
        if: ${{ always() }}
        with:
          author_name: Github Actions
          author_email: info@ortussolutions.com
          message: 'Version bump'
          add: |
            version.json
            changelog.md